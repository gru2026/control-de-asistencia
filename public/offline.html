<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>Sin conexión · GRU-system</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
  .caja { max-width: 24rem; text-align: center; background: #fff; border: 1px solid #e2e8f0;
    border-radius: 16px; padding: 32px 24px; box-shadow: 0 10px 30px rgb(15 23 42 / .08); }
  .icono { width: 56px; height: 56px; margin: 0 auto 16px; display: grid; place-items: center;
    border-radius: 50%; background: #fef3c7; color: #b45309; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #475569; line-height: 1.5; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #0f172a;
    color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
</style>
</head>
<body>
  <main class="caja">
    <div class="icono" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>Sin conexión</h1>
    <p>GRU-system necesita internet para funcionar. Revise su conexión de datos o Wi-Fi e intente de nuevo. Si no puede conectarse, diríjase a secretaría.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
  <script>addEventListener("online", () => location.reload());</script>
</body>
</html>
